name: windows

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - '.src/*/linux/**.cppm'
      - '.src/*/linux/**.c'
      - '.src/*/linux/**.cpp'
      - '.src/*/linux/**.h'
      - '.src/*/linux/**.hpp'
      - '.src/*/posix/**.cppm'
      - '.src/*/posix/**.c'
      - '.src/*/posix/**.cpp'
      - '.src/*/posix/**.h'
      - '.src/*/posix/**.hpp'
      - '.src/*/darwin/**.cppm'
      - '.src/*/darwin/**.c'
      - '.src/*/darwin/**.cpp'
      - '.src/*/darwin/**.h'
      - '.src/*/darwin/**.hpp'
      - '.src/*/macos/**.cppm'
      - '.src/*/macos/**.c'
      - '.src/*/macos/**.cpp'
      - '.src/*/macos/**.h'
      - '.src/*/macos/**.hpp'
      - '.src/*/ios/**.cppm'
      - '.src/*/ios/**.c'
      - '.src/*/ios/**.cpp'
      - '.src/*/ios/**.h'
      - '.src/*/ios/**.hpp'
      - '.src/*/android/**.cppm'
      - '.src/*/android/**.c'
      - '.src/*/android/**.cpp'
      - '.src/*/android/**.h'
      - '.src/*/android/**.hpp'
      - '**.m'
      - '**.swift'
      - .github/workflows/**.yml
      - '!.github/workflows/windows.yml'
      - .gitignore
      - LICENSE
      - README.md

  push:
    branches: [main, develop]
    paths-ignore:
      - '.src/*/linux/**.cppm'
      - '.src/*/linux/**.c'
      - '.src/*/linux/**.cpp'
      - '.src/*/linux/**.h'
      - '.src/*/linux/**.hpp'
      - '.src/*/posix/**.cppm'
      - '.src/*/posix/**.c'
      - '.src/*/posix/**.cpp'
      - '.src/*/posix/**.h'
      - '.src/*/posix/**.hpp'
      - '.src/*/darwin/**.cppm'
      - '.src/*/darwin/**.c'
      - '.src/*/darwin/**.cpp'
      - '.src/*/darwin/**.h'
      - '.src/*/darwin/**.hpp'
      - '.src/*/macos/**.cppm'
      - '.src/*/macos/**.c'
      - '.src/*/macos/**.cpp'
      - '.src/*/macos/**.h'
      - '.src/*/macos/**.hpp'
      - '.src/*/ios/**.cppm'
      - '.src/*/ios/**.c'
      - '.src/*/ios/**.cpp'
      - '.src/*/ios/**.h'
      - '.src/*/ios/**.hpp'
      - '.src/*/android/**.cppm'
      - '.src/*/android/**.c'
      - '.src/*/android/**.cpp'
      - '.src/*/android/**.h'
      - '.src/*/android/**.hpp'
      - '**.m'
      - '**.swift'
      - .github/workflows/**.yml
      - '!.github/workflows/windows.yml'
      - .gitignore
      - LICENSE
      - README.md

jobs:
  build:
    name: ${{ matrix.compiler }}-${{ matrix.cpplib }} ${{ matrix.arch }}  (${{ matrix.kind }}/${{ matrix.mode }})

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
        compiler: [llvm]
        cpplib: [libc++]
        arch: [x64]
        kind: [static, shared]
        mode: [release, debug]

    runs-on: ${{ matrix.os }}
    if: ${{ !contains(github.event.head_commit.message, 'ci skip') }}

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.cpplib }}-${{ matrix.arch }}-${{ matrix.kind }}-${{ matrix.mode }}

    steps:
      - name: Use current date as xmake package cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> $GITHUB_OUTPUT
        shell: bash

      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3
        with:
          minimum-size: 8GB
          maximum-size: 32GB
          disk-root: "D:"

      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Restore cached LLVM
        id: restore-llvmcache
        if: ${{ startsWith(matrix.compiler, 'llvm') }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/llvm.7z
          key: ${{ matrix.os }}-LLVM-24-${{ matrix.arch }}

      - name: Download LLVM
        if: ${{ startsWith(matrix.compiler, 'llvm') && !steps.restore-llvmcache.outputs.cache-hit }}
        run: |
          curl.exe -o "${{ github.workspace }}/llvm.7z" -LO https://github.com/Arthapz/llvm-prebuilt/releases/download/llvm-24/llvm.7z

      - name: Extract LLVM
        if: ${{ startsWith(matrix.compiler, 'llvm') }}
        run: |
          7z x "${{ github.workspace }}/llvm.7z" -o"${{ github.workspace }}/llvm"

      - name: Cache LLVM
        if: ${{ startsWith(matrix.compiler, 'llvm') && !steps.restore-llvmcache.outputs.cache-hit }}
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/llvm
          key: ${{ steps.restore-llvmcache.outputs.cache-primary-key }}

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup XMake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        run: xmake repo --update

      - name: Retrieve dependencies hash
        id: dep_hash
        run: echo "hash=$(xmake l utils.ci.packageskey)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore cached packages
        id: restore-depcache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.XMAKE_GLOBALDIR }}/.xmake/packages
          key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.cpplib }}-${{ matrix.arch }}-${{ matrix.mode }}-${{ steps.dep_hash.outputs.hash }}-W${{ steps.cache_key.outputs.key }}

      - name: Configure & Install dependencies
        id: configure
        run: |
          xmake f -vD `
           --yes `
           -m ${{ (matrix.mode == 'release' || matrix.mode == 'debug') && matrix.mode || 'releasedbg' }} `
           -k ${{ matrix.kind }} `
           --examples=y `
           --tests=y `
           --on_ci=y `
           --sanitizers=n `
           ${{ (matrix.compiler == 'llvm') && '--toolchain=llvm --sdk="$env:GITHUB_WORKSPACE/llvm/llvm"' || '' }} `
           ${{ (matrix.cpplib == 'libc++') && '--runtimes="c++_static"' || '' }} `
           --policies="platform.longpaths"

      - name: Cache xmake dependencies
        if: ${{ !steps.restore-depcache.outputs.cache-hit }}
        uses: actions/cache/save@v6
        with:
          path: ${{ env.XMAKE_PKG_INSTALLDIR }}
          key: ${{ steps.restore-depcache.outputs.cache-primary-key }}

      - name: Build
        id: build
        run: |
          xmake b -vD

      - name: Run unit tests
        run: |
          xmake test -vD

      - name: Installation
        run: xmake install -vD --installdir="${{ github.workspace }}/output"

      # - name: Add libc++ dll
      #   if: ${{ matrix.cpplib == 'libc++' }}
      #   run: |
      #     cp "${{ github.workspace }}/llvm/llvm/bin/c++.dll" "${{ github.workspace }}/output/bin/"
      #     cp "${{ github.workspace }}/llvm/llvm/lib/clang/24/lib/windows/clang_rt.asan_dynamic-x86_64.dll" "${{ github.workspace }}/output/bin/"

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.cpplib }}-${{ matrix.arch }}-${{ matrix.kind }}-${{ matrix.mode }}
          path: ${{ github.workspace }}/output
