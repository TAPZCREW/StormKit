name: iOS

on:
  push:
    branches: [ ]
    paths-ignore:
      - '.src/*/win32/**.cppm'
      - '.src/*/win32/**.c'
      - '.src/*/win32/**.cpp'
      - '.src/*/win32/**.h'
      - '.src/*/win32/**.hpp'
      - '.src/*/macos/**.m'
      - '.src/*/macos/**.swift'
      - '.src/*/macos/**.cppm'
      - '.src/*/macos/**.c'
      - '.src/*/macos/**.cpp'
      - '.src/*/macos/**.h'
      - '.src/*/macos/**.hpp'
      - '.src/*/linux/**.cppm'
      - '.src/*/linux/**.c'
      - '.src/*/linux/**.cpp'
      - '.src/*/linux/**.h'
      - '.src/*/linux/**.hpp'
      - '.src/*/android/**.cppm'
      - '.src/*/android/**.c'
      - '.src/*/android/**.cpp'
      - '.src/*/android/**.h'
      - '.src/*/android/**.hpp'
      - .github/workflows/**.yml
      - '!.github/workflows/ios.yml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
  pull_request:
    branches: [ ]
    paths-ignore:
      - '.src/*/win32/**.cppm'
      - '.src/*/win32/**.c'
      - '.src/*/win32/**.cpp'
      - '.src/*/win32/**.h'
      - '.src/*/win32/**.hpp'
      - '.src/*/macos/**.m'
      - '.src/*/macos/**.swift'
      - '.src/*/macos/**.cppm'
      - '.src/*/macos/**.c'
      - '.src/*/macos/**.cpp'
      - '.src/*/macos/**.h'
      - '.src/*/macos/**.hpp'
      - '.src/*/linux/**.cppm'
      - '.src/*/linux/**.c'
      - '.src/*/linux/**.cpp'
      - '.src/*/linux/**.h'
      - '.src/*/linux/**.hpp'
      - '.src/*/android/**.cppm'
      - '.src/*/android/**.c'
      - '.src/*/android/**.cpp'
      - '.src/*/android/**.h'
      - '.src/*/android/**.hpp'
      - .github/workflows/**.yml
      - '!.github/workflows/ios.yml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

jobs:
  build:
    name: iOS ( ${{ matrix.kind }}-${{ matrix.mode }} )

    strategy:
      fail-fast: false
      matrix:
        os: [macOS-latest]
        kind: [static, shared]
        mode: [release, debug, asan]

    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-iOS-${{ matrix.kind }}-${{ matrix.mode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev

      - name: Update xmake repository
        run: xmake repo --update

      - name: Configure & Build
        id: build
        run: |
          xmake f -D --yes -m ${{ matrix.mode }} -k ${{ matrix.kind }} -p iphoneos --build_tests=false
          xmake b -D

      - name: Installation
        run: xmake install -D --installdir="${{ runner.workspace }}/output"

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v1
        with:
          name: iOS-x64-${{ matrix.kind }}-${{ matrix.mode }}
          path: ${{ runner.workspace }}/output
